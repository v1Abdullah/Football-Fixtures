name: Daily Football Fixtures

on:
  schedule:
    # Every day at 08:55 Saudi Arabia time (05:55 UTC)
    - cron: "57 5 * * *"

  workflow_dispatch:
    inputs:
      test_discord:
        description: Send a one-time Discord connection test message
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-football-fixtures
  cancel-in-progress: false

jobs:
  send-fixtures:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Check matches and send Discord announcements
        env:
          DISCORD_WEBHOOK_SAUDI: ${{ secrets.DISCORD_WEBHOOK_SAUDI }}
          DISCORD_WEBHOOK_EPL: ${{ secrets.DISCORD_WEBHOOK_EPL }}
          DISCORD_WEBHOOK_LALIGA: ${{ secrets.DISCORD_WEBHOOK_LALIGA }}
          DISCORD_WEBHOOK_LIGUE1: ${{ secrets.DISCORD_WEBHOOK_LIGUE1 }}
          DISCORD_WEBHOOK_ASIAN_CL: ${{ secrets.DISCORD_WEBHOOK_ASIAN_CL }}
          DISCORD_WEBHOOK_UCL: ${{ secrets.DISCORD_WEBHOOK_UCL }}
          TEST_DISCORD_MESSAGE: ${{ inputs.test_discord }}
        run: python main.py

      - name: Save sent match IDs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent_fixtures.json
          if ! git diff --cached --quiet; then
            git commit -m "Update announced football fixtures"
            git push
          fi
